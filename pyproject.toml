[build-system]
requires = ["setuptools>=61.0", "wheel", "pybind11>=2.10.0"]
build-backend = "setuptools.build_meta"

[project]
name = "visual_ai"
version = "0.3.0"
description = "High-performance Computer Vision AI tracking and physics library for game developers"
readme = "README.md"
# The floor is ours: pipeline.py and jitter_analyzer.py use PEP-604 unions in
# function signatures evaluated at def time, so the package raises TypeError on
# import under 3.9 - the old ">=3.8" was a promise the code stopped keeping.
# The ceiling is mediapipe's: it publishes no wheels for 3.13+, so a 3.13
# interpreter fails at dependency resolution with a message that says nothing
# about why. State both here so pip reports the real constraints.
requires-python = ">=3.10,<3.13"
license = { text = "Proprietary" }
authors = [
    { name = "Ashiqalink" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    # Proprietary, and deliberately not an OSI classifier. "Private :: Do Not
    # Upload" is PyPI's kill switch: the index rejects any upload carrying an
    # unrecognised Private :: classifier, so an accidental `twine upload` of a
    # closed-source package fails at the server instead of publishing it.
    "License :: Other/Proprietary License",
    "Private :: Do Not Upload",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.20.0",
    "opencv-python>=4.8.0",
    "mediapipe>=0.10.14,<=0.10.35",
]

[project.urls]
Homepage = "https://github.com/Ashiqalink/visual-ai-game-engine"
Documentation = "https://github.com/Ashiqalink/visual-ai-game-engine/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
# The rule set the code already mostly follows, written down so drift gets
# caught at edit time instead of re-audited later. Fix violations rather than
# widening the ignores; anything deliberately exempt is a targeted noqa with a
# reason at the site.
line-length = 100
extend-exclude = ["build", "game_env", "cpp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# __init__ builds the dual-engine surface: the C++ probe and the fallback
# binding have to run before the re-exports that depend on which one loaded.
"src/visual_ai/__init__.py" = ["E402"]
# Inserts its sys.path before importing the package, the same way the games'
# engine_bootstrap does.
"tests/test_3d_character_options.py" = ["E402"]
