[build-system]
requires = ["setuptools>=61.0", "wheel", "pybind11>=2.10.0"]
build-backend = "setuptools.build_meta"

[project]
name = "visual_ai"
version = "0.3.0"
description = "High-performance Computer Vision AI tracking and physics library for game developers"
readme = "README.md"
# Upper bound is mediapipe's, not ours: it publishes no wheels for 3.13+, so a
# 3.13 interpreter fails at dependency resolution with a message that says
# nothing about why. Cap it here so pip reports the real constraint instead.
requires-python = ">=3.8,<3.13"
license = { text = "Proprietary" }
authors = [
    { name = "Ashiqalink" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    # Proprietary, and deliberately not an OSI classifier. "Private :: Do Not
    # Upload" is PyPI's kill switch: the index rejects any upload carrying an
    # unrecognised Private :: classifier, so an accidental `twine upload` of a
    # closed-source package fails at the server instead of publishing it.
    "License :: Other/Proprietary License",
    "Private :: Do Not Upload",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.20.0",
    "opencv-python>=4.8.0",
    "mediapipe>=0.10.14,<=0.10.35",
]

[project.urls]
Homepage = "https://github.com/user/visual_ai_game_engine"
Documentation = "https://github.com/user/visual_ai_game_engine/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]
