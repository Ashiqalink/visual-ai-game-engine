[pytest]
# The package lives in src/, but pytest puts the rootdir on sys.path ahead of
# PYTHONPATH. Without this, running the suite from the engine directory imports
# whatever happens to sit at the root instead — which is exactly how a stale
# duplicate of visual_ai went unnoticed here long enough to fail 32 tests that
# pass against the real source.
pythonpath = src
testpaths = tests

# Conventions: test files are named test_*.py. (pytest's default collection
# also accepts *_test.py - the old integration_test.py WAS being run - but one
# spelling means nobody has to know that.) New tests use plain pytest style -
# module-level test_* functions and bare asserts; the unittest.TestCase files
# predate the choice and are not worth rewriting.
